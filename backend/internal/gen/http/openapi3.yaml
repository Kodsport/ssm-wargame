  /ctfs/{slug}/attempt:
    post:
      tags:
      - ctf
      summary: SubmitFlag ctf
      description: Submit a flag for a user in a ctf.
      operationId: ctf#SubmitFlag
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          example: Nisi consequatur nihil.
        example: Laborum unde animi similique et.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFlagRequestBody2'
            example:
              challenge_id: 85163218-8735-42ed-a7a6-42a9de2294df
              flag: SSM{yo}
              password: user-password
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CTFSolve'
              example:
                challenge_id: Rem vel sunt commodi ab voluptate in.
                ctf_id: Eos consectetur eum delectus molestiae facere at.
                id: Veritatis minus aut non.
                solved_at: Odit in.
                user_id: Velit quia eos quasi tempore illo.
        "400":
          description: If the challenge is already solved
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                id: 3F1FKVRR
                message: Value of ID must be an integer
                name: bad_request
        "403":
          description: If the ctf is not active
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                id: 3F1FKVRR
                message: Value of ID must be an integer
                name: bad_request
        "409":
          description: If the challenge is already solved
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                id: 3F1FKVRR
                message: Value of ID must be an integer
                name: bad_request
