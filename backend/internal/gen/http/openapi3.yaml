        example: Ea ab.
      - name: slug
        in: path
        required: true
        schema:
          type: string
          example: Voluptatibus sint est vero omnis qui.
        example: Aut perspiciatis deleniti recusandae voluptatem sed consequuntur.
      responses:
        "200":
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CTFUser'
              example:
                ctf_id: Corporis neque hic quo.
                id: Sequi soluta aut doloremque quis.
                password: Fugiat consequatur eos sint labore alias.
                username: Eligendi omnis est rem.
        "401":
          description: Unauthorized response.
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                id: 3F1FKVRR
                message: Value of ID must be an integer
                name: bad_request
        "404":
          description: Not Found response.
          content:
            application/vnd.goa.error:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                id: 3F1FKVRR
                message: Value of ID must be an integer
                name: bad_request
